<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="bgGlow" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0c4a6e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#08080a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gridGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181f" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#101014" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="100%" height="100%" fill="#090a0f" />
  <rect width="100%" height="100%" fill="url(#bgGlow)" />

  <!-- Ambient Light Orbs -->
  <circle cx="850" cy="220" r="180" fill="#38bdf8" opacity="0.18" filter="url(#blurFilter)" />
  <circle cx="350" cy="520" r="220" fill="#6366f1" opacity="0.14" filter="url(#blurFilter)" />

  <!-- Perspective Grid Lines -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="650" x2="1100" y2="650" />
    <line x1="200" y1="600" x2="1000" y2="600" />
    <line x1="280" y1="560" x2="920" y2="560" />
    <line x1="600" y1="200" x2="100" y2="750" />
    <line x1="600" y1="200" x2="350" y2="750" />
    <line x1="600" y1="200" x2="600" y2="750" />
    <line x1="600" y1="200" x2="850" y2="750" />
    <line x1="600" y1="200" x2="1100" y2="750" />
  </g>

  <!-- Central Glass Operating Window -->
  <rect x="220" y="120" width="760" height="480" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Window Header with Apple traffic lights -->
  <circle cx="252" cy="150" r="5" fill="#ff5f56" />
  <circle cx="268" cy="150" r="5" fill="#ffbd2e" />
  <circle cx="284" cy="150" r="5" fill="#27c93f" />
  <text x="600" y="154" fill="#86868b" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="1">AETHERIA SPATIAL ENGINE v2.4 • 120 FPS</text>

  <!-- Dynamic Waveform Curves -->
  <path d="M 260 360 Q 340 220 420 360 T 580 360 T 740 360 T 900 360 T 940 360" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" opacity="0.85" />
  <path d="M 260 380 Q 360 480 460 380 T 660 380 T 860 380 T 940 380" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" stroke-dasharray="6 4" />

  <!-- Acoustic Spatial Nodes -->
  <g transform="translate(600, 360)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="12" fill="#38bdf8" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <!-- Left Glass Channel Pill -->
  <rect x="260" y="200" width="180" height="80" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <text x="278" y="230" fill="#38bdf8" font-family="monospace" font-size="11">NODE_CH_01</text>
  <text x="278" y="255" fill="#f5f5f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Binaural Ambience</text>

  <!-- Right Glass Metrics Pill -->
  <rect x="760" y="200" width="180" height="80" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <text x="778" y="230" fill="#34d399" font-family="monospace" font-size="11">LATENCY: 4.8ms</text>
  <text x="778" y="255" fill="#f5f5f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">32-Bit Float DSP</text>

  <!-- Lower Frequency Spectrum Bars -->
  <g fill="#38bdf8" opacity="0.6">
    <rect x="360" y="500" width="6" height="40" rx="3" />
    <rect x="380" y="480" width="6" height="60" rx="3" />
    <rect x="400" y="460" width="6" height="80" rx="3" fill="#818cf8" />
    <rect x="420" y="490" width="6" height="50" rx="3" />
    <rect x="440" y="470" width="6" height="70" rx="3" />
    <rect x="460" y="510" width="6" height="30" rx="3" />
    <rect x="480" y="450" width="6" height="90" rx="3" fill="#38bdf8" />
    <rect x="500" y="475" width="6" height="65" rx="3" />
    <rect x="520" y="505" width="6" height="35" rx="3" />
    <rect x="540" y="465" width="6" height="75" rx="3" />
    <rect x="560" y="495" width="6" height="45" rx="3" />
    <rect x="580" y="440" width="6" height="100" rx="3" fill="#34d399" />
    <rect x="600" y="460" width="6" height="80" rx="3" />
    <rect x="620" y="485" width="6" height="55" rx="3" />
    <rect x="640" y="510" width="6" height="30" rx="3" />
    <rect x="660" y="470" width="6" height="70" rx="3" />
    <rect x="680" y="450" width="6" height="90" rx="3" />
    <rect x="700" y="490" width="6" height="50" rx="3" />
    <rect x="720" y="520" width="6" height="20" rx="3" />
    <rect x="740" y="480" width="6" height="60" rx="3" />
    <rect x="760" y="505" width="6" height="35" rx="3" />
    <rect x="780" y="475" width="6" height="65" rx="3" />
    <rect x="800" y="515" width="6" height="25" rx="3" />
    <rect x="820" y="490" width="6" height="50" rx="3" />
  </g>
</svg>

