<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="planetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#312e81" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2" />
    </radialGradient>
    <radialGradient id="atmosAura" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="100%" height="100%" fill="#08070d" />

  <!-- Distant Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="180" r="1.5" />
    <circle cx="280" cy="90" r="1" />
    <circle cx="450" cy="220" r="1.8" />
    <circle cx="950" cy="140" r="1.5" />
    <circle cx="1080" cy="320" r="1" />
    <circle cx="820" cy="80" r="2" />
    <circle cx="150" cy="620" r="1" />
    <circle cx="1020" cy="640" r="1.5" />
    <circle cx="700" cy="670" r="1.2" />
  </g>

  <!-- Atmosphere Halo -->
  <circle cx="600" cy="375" r="240" fill="url(#atmosAura)" filter="url(#glowFilter)" />

  <!-- Orbital Rings in 3D Perspective -->
  <ellipse cx="600" cy="375" rx="440" ry="140" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.4" transform="rotate(-18 600 375)" />
  <ellipse cx="600" cy="375" rx="480" ry="155" fill="none" stroke="#a5b4fc" stroke-width="1" stroke-dasharray="8 6" opacity="0.25" transform="rotate(-18 600 375)" />
  <ellipse cx="600" cy="375" rx="360" ry="115" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.5" transform="rotate(-18 600 375)" />

  <!-- Central Celestial Sphere -->
  <circle cx="600" cy="375" r="160" fill="url(#planetGlow)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" />

  <!-- Planetary Grid / Wireframe Geodesic Lines -->
  <g stroke="#818cf8" stroke-width="1" opacity="0.3" fill="none">
    <ellipse cx="600" cy="375" rx="160" ry="60" />
    <ellipse cx="600" cy="375" rx="160" ry="120" />
    <line x1="600" y1="215" x2="600" y2="535" />
    <ellipse cx="600" cy="375" rx="70" ry="160" />
    <ellipse cx="600" cy="375" rx="130" ry="160" />
  </g>

  <!-- Specular Crescent Sun Reflection -->
  <path d="M 470 290 A 160 160 0 0 1 730 290 A 150 150 0 0 0 470 290" fill="#c7d2fe" opacity="0.3" />

  <!-- Satellite Orbit Points -->
  <circle cx="320" cy="460" r="6" fill="#818cf8" />
  <circle cx="320" cy="460" r="16" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.5" />
  <circle cx="890" cy="280" r="5" fill="#38bdf8" />

  <!-- Floating HUD Telemetry Pill -->
  <g transform="translate(180, 500)">
    <rect width="280" height="90" rx="12" fill="rgba(15, 15, 23, 0.8)" stroke="rgba(129, 140, 248, 0.25)" stroke-width="1" />
    <text x="24" y="34" fill="#818cf8" font-family="monospace" font-size="11" letter-spacing="1">SIM_GRAV_TENSOR // ACTIVE</text>
    <text x="24" y="60" fill="#f5f5f7" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">N-Body 500k Points</text>
    <text x="24" y="78" fill="#86868b" font-family="-apple-system, sans-serif" font-size="11">WebGPU Compute Shader Pipeline</text>
  </g>
</svg>

