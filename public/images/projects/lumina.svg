<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="luminaBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#022c22" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#08080a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sheetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161c19" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0c100e" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#080a09" />
  <rect width="100%" height="100%" fill="url(#luminaBg)" />

  <!-- Background Grid Dots -->
  <g fill="rgba(52, 211, 153, 0.15)">
    <circle cx="200" cy="150" r="1.5" /><circle cx="300" cy="150" r="1.5" /><circle cx="400" cy="150" r="1.5" /><circle cx="500" cy="150" r="1.5" /><circle cx="600" cy="150" r="1.5" /><circle cx="700" cy="150" r="1.5" /><circle cx="800" cy="150" r="1.5" /><circle cx="900" cy="150" r="1.5" /><circle cx="1000" cy="150" r="1.5" />
    <circle cx="200" cy="250" r="1.5" /><circle cx="300" cy="250" r="1.5" /><circle cx="400" cy="250" r="1.5" /><circle cx="500" cy="250" r="1.5" /><circle cx="600" cy="250" r="1.5" /><circle cx="700" cy="250" r="1.5" /><circle cx="800" cy="250" r="1.5" /><circle cx="900" cy="250" r="1.5" /><circle cx="1000" cy="250" r="1.5" />
    <circle cx="200" cy="350" r="1.5" /><circle cx="300" cy="350" r="1.5" /><circle cx="400" cy="350" r="1.5" /><circle cx="500" cy="350" r="1.5" /><circle cx="600" cy="350" r="1.5" /><circle cx="700" cy="350" r="1.5" /><circle cx="800" cy="350" r="1.5" /><circle cx="900" cy="350" r="1.5" /><circle cx="1000" cy="350" r="1.5" />
    <circle cx="200" cy="450" r="1.5" /><circle cx="300" cy="450" r="1.5" /><circle cx="400" cy="450" r="1.5" /><circle cx="500" cy="450" r="1.5" /><circle cx="600" cy="450" r="1.5" /><circle cx="700" cy="450" r="1.5" /><circle cx="800" cy="450" r="1.5" /><circle cx="900" cy="450" r="1.5" /><circle cx="1000" cy="450" r="1.5" />
  </g>

  <!-- Cascading Translucent Glass Cards (Depth hierarchy) -->
  <!-- Layer 1 (Back) -->
  <rect x="250" y="100" width="700" height="420" rx="20" fill="rgba(25, 35, 30, 0.4)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
  
  <!-- Layer 2 (Middle) -->
  <rect x="290" y="150" width="620" height="440" rx="20" fill="rgba(18, 25, 22, 0.65)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />

  <!-- Layer 3 (Foreground Sheet - Apple Sheet Metaphor) -->
  <rect x="330" y="200" width="540" height="460" rx="24" fill="url(#sheetGrad)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.5" filter="drop-shadow(0 25px 35px rgba(0,0,0,0.6))" />

  <!-- Grab handle at top of sheet -->
  <rect x="560" y="216" width="80" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.25)" />

  <!-- Spring Physics Oscillation Curve -->
  <g transform="translate(380, 310)">
    <text x="0" y="-20" fill="#34d399" font-family="monospace" font-size="11" letter-spacing="1">SPRING CURVE: DAMPING 1.0 (CRITICALLY DAMPED)</text>
    <line x1="0" y1="60" x2="440" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4 4" />
    <path d="M 0 120 C 60 -10, 140 60, 440 60" fill="none" stroke="#34d399" stroke-width="3" />
    <circle cx="220" cy="56" r="5" fill="#ffffff" stroke="#34d399" stroke-width="2" />
  </g>

  <!-- Toggle Switch & Controls inside the sheet -->
  <g transform="translate(380, 480)">
    <!-- Switch 1 -->
    <rect x="0" y="0" width="56" height="32" rx="16" fill="#34d399" />
    <circle cx="38" cy="16" r="12" fill="#ffffff" />
    <text x="72" y="21" fill="#f5f5f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="500">Velocity Handoff Enabled</text>

    <!-- Switch 2 -->
    <rect x="0" y="52" width="56" height="32" rx="16" fill="rgba(255,255,255,0.12)" />
    <circle cx="18" cy="68" r="12" fill="#ffffff" />
    <text x="72" y="73" fill="#86868b" font-family="-apple-system, sans-serif" font-size="14" font-weight="500">Rubberband Bounds (0.55 constant)</text>
  </g>
</svg>

