<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="novaBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#451a03" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#08080a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0a0806" />
  <rect width="100%" height="100%" fill="url(#novaBg)" />

  <!-- Global Coordinates / Wireframe Map Contour -->
  <g stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.2" fill="none">
    <!-- Latitude Lines -->
    <ellipse cx="600" cy="375" rx="420" ry="240" />
    <ellipse cx="600" cy="375" rx="420" ry="160" />
    <ellipse cx="600" cy="375" rx="420" ry="80" />
    <line x1="180" y1="375" x2="1020" y2="375" stroke="rgba(245, 158, 11, 0.4)" stroke-dasharray="6 4" />
    <!-- Longitude Lines -->
    <ellipse cx="600" cy="375" rx="140" ry="240" />
    <ellipse cx="600" cy="375" rx="280" ry="240" />
    <line x1="600" y1="135" x2="600" y2="615" stroke="rgba(245, 158, 11, 0.4)" />
  </g>

  <!-- Orbital Ground Track Sinusoidal Waves -->
  <path d="M 180 320 Q 390 120 600 375 T 1020 430" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M 180 440 Q 390 600 600 375 T 1020 310" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Satellite Nodes -->
  <g transform="translate(480, 240)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="7" fill="#f59e0b" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    <line x1="-20" y1="0" x2="-8" y2="0" stroke="#f59e0b" stroke-width="2" />
    <line x1="8" y1="0" x2="20" y2="0" stroke="#f59e0b" stroke-width="2" />
    <text x="35" y="4" fill="#f59e0b" font-family="monospace" font-size="11">ISS // NORAD 25544</text>
  </g>

  <g transform="translate(820, 340)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="0" r="6" fill="#38bdf8" />
    <text x="28" y="4" fill="#38bdf8" font-family="monospace" font-size="11">STARLINK-3104</text>
  </g>

  <!-- Telemetry Overlay HUD -->
  <g transform="translate(180, 520)">
    <rect width="840" height="90" rx="14" fill="rgba(24, 18, 12, 0.85)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.2" />
    <circle cx="36" cy="45" r="6" fill="#34d399" />
    <text x="54" y="40" fill="#f59e0b" font-family="monospace" font-size="11">DOWNLINK: 15,400 MSGS/S</text>
    <text x="54" y="60" fill="#f5f5f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Global Constellation Telemetry Stream</text>
    <text x="640" y="50" fill="#86868b" font-family="monospace" font-size="13">ALT: 418.2 KM • INC: 51.6°</text>
  </g>
</svg>

