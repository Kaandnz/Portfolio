<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="kromaBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#831843" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#500724" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#08080a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="curveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0a0809" />
  <rect width="100%" height="100%" fill="url(#kromaBg)" />

  <!-- Studio Canvas Frame -->
  <rect x="160" y="100" width="880" height="520" rx="16" fill="rgba(18, 14, 16, 0.75)" stroke="rgba(236, 72, 153, 0.25)" stroke-width="1.5" />

  <!-- Grid Blueprint lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="160" y1="230" x2="1040" y2="230" />
    <line x1="160" y1="360" x2="1040" y2="360" />
    <line x1="160" y1="490" x2="1040" y2="490" />
    <line x1="380" y1="100" x2="380" y2="620" />
    <line x1="600" y1="100" x2="600" y2="620" />
    <line x1="820" y1="100" x2="820" y2="620" />
  </g>

  <!-- Flowing Generative Typographic Letterform Morph (Bezier Ribbon) -->
  <path d="M 280 440 C 320 220, 480 180, 600 360 C 720 540, 880 480, 920 260" fill="none" stroke="url(#curveGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 320 480 C 420 300, 520 240, 600 360 C 680 480, 780 420, 860 300" fill="none" stroke="url(#curveGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="6 4" />

  <!-- Vector Anchor Points & Handles (Apple Graphics Editor style) -->
  <g fill="#ffffff" stroke="#ec4899" stroke-width="2">
    <!-- Point 1 -->
    <circle cx="280" cy="440" r="6" />
    <line x1="280" y1="440" x2="320" y2="220" stroke="#ec4899" stroke-width="1.2" stroke-dasharray="3 3" />
    <rect x="316" y="216" width="8" height="8" fill="#ec4899" />

    <!-- Center Point -->
    <circle cx="600" cy="360" r="7" />
    <line x1="600" y1="360" x2="480" y2="180" stroke="#ec4899" stroke-width="1.2" stroke-dasharray="3 3" />
    <rect x="476" y="176" width="8" height="8" fill="#ec4899" />
    <line x1="600" y1="360" x2="720" y2="540" stroke="#ec4899" stroke-width="1.2" stroke-dasharray="3 3" />
    <rect x="716" y="536" width="8" height="8" fill="#ec4899" />

    <!-- Point 3 -->
    <circle cx="920" cy="260" r="6" />
    <line x1="920" y1="260" x2="880" y2="480" stroke="#ec4899" stroke-width="1.2" stroke-dasharray="3 3" />
    <rect x="876" y="476" width="8" height="8" fill="#ec4899" />
  </g>

  <!-- Float Toolbar Controls -->
  <g transform="translate(420, 540)">
    <rect width="360" height="50" rx="25" fill="rgba(24, 18, 22, 0.9)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="32" y="30" fill="#ec4899" font-family="monospace" font-size="12">CURVE: CUBIC BEZIER</text>
    <text x="210" y="30" fill="#f5f5f7" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Simplify: 99.4%</text>
  </g>
</svg>

